server:
  port: 8081
spring:
  application:
    name: drivers
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/truckmanager}
          # Ustawione jawnie, zeby JwtDecoder nie odpytywal Keycloaka o discovery przy starcie.
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
