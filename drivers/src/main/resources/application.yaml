server:
  port: 8081
spring:
  application:
    name: drivers
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trucksdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:example}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/truckmanager}
          # Ustawione jawnie, zeby JwtDecoder nie odpytywal Keycloaka o discovery przy starcie.
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
