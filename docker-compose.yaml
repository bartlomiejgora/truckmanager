services:
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    ports:
      - 27017:27017

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8082:8081
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: test
      ME_CONFIG_BASICAUTH_PASSWORD: test

  postgres:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
      POSTGRES_DB: trucksdb
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d trucksdb" ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    restart: always
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: example
      # Issuer musi byc taki sam, jak adres, pod ktorym aplikacje widza Keycloaka.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HEALTH_ENABLED: true
    ports:
      - 8180:8080
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  drivers:
    image: drivers:latest
    build:
      context: ./drivers
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8081:8081
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trucksdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: example
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/truckmanager
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/truckmanager/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  trucks:
    image: trucks:latest
    build:
      context: ./trucks
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8080:8080
    environment:
      MONGO_DB_URL: mongodb://root:example@mongo:27017/trucks?authSource=admin
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/truckmanager
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/truckmanager/protocol/openid-connect/certs
    depends_on:
      - mongo
      - keycloak

volumes:
  postgres-data:
